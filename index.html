<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Memorama americanista</title>
    <meta name="description" content="Memorama para aficionados del Club América">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet prefetch" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
    <link rel="stylesheet prefetch" href="https://fonts.googleapis.com/css?family=Coda">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" type="text/css" href="https://csshake.surge.sh/csshake.min.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Memorama americanista</h1>
        </header>

        <section class="deck-picker" aria-label="Escoge un memorama">
            <button class="deck-option active" type="button" data-deck="jerseys">
                Camisetas históricas
                <span>8 pares</span>
            </button>
            <button class="deck-option" type="button" data-deck="titles">
                Títulos de liga
                <span>12 pares</span>
            </button>
        </section>

        <section class="score-panel">
            <ul class="stars">
                <li class="estr"><i class="fa fa-star"></i></li>
                <li class="estr"><i class="fa fa-star"></i></li>
                <li class="estr"><i class="fa fa-star"></i></li>
            </ul>

            <span class="moves">0</span> Movimientos

            <label id="minutes">00</label>:<label id="seconds">00</label>

            <button class="restart" type="button" aria-label="Reiniciar memorama">
                <i class="fa fa-repeat"></i>
            </button>
        </section>

        <ul class="deck" aria-live="polite"></ul>
    </div>

    <p>
        <a href="https://jsainzs.github.io/america_hoy/" class="back-link">
            ← Volver a Hoy juega el América
        </a>
    </p>

    <script src="js/app.js"></script>
</body>
</html>
